<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#09090d" />

  <title>Pocket Furry</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main
    id="app"
    class="focusable"
    tabindex="0"
  >

    <!-- ============================================
         COMPACT STATUS HUD

         Mood | Health | Hunger | Clean | Energy
    ============================================= -->

    <section
      id="statusHud"
      class="status-hud"
    >

      <!-- MOOD -->

      <div
        id="moodHud"
        class="mini-stat mood-stat"
      >

        <span
          id="moodEmoji"
          class="mini-icon mood-icon"
        >
          😊
        </span>

      </div>


      <!-- HEALTH -->

      <div
        class="mini-stat"
        data-stat="health"
      >

        <span class="mini-icon">
          +
        </span>

        <div class="mini-meter">

          <div
            id="healthBar"
            class="mini-fill"
          ></div>

        </div>

      </div>


      <!-- HUNGER -->

      <div
        class="mini-stat"
        data-stat="hunger"
      >

        <span class="mini-icon">
          ◆
        </span>

        <div class="mini-meter">

          <div
            id="hungerBar"
            class="mini-fill"
          ></div>

        </div>

      </div>


      <!-- CLEANLINESS -->

      <div
        class="mini-stat"
        data-stat="cleanliness"
      >

        <span class="mini-icon">
          ✦
        </span>

        <div class="mini-meter">

          <div
            id="cleanlinessBar"
            class="mini-fill"
          ></div>

        </div>

      </div>


      <!-- ENERGY -->

      <div
        class="mini-stat"
        data-stat="energy"
      >

        <span class="mini-icon">
          ☾
        </span>

        <div class="mini-meter">

          <div
            id="energyBar"
            class="mini-fill"
          ></div>

        </div>

      </div>

    </section>


    <!-- ============================================
         CHARACTER AREA
    ============================================= -->

    <section
      id="petStage"
      class="pet-stage"
    >

      <div id="characterMover">

        <img
          id="character"
          src="assets/characters/noctis/idle.gif"
          alt="Pocket Furry character"
          draggable="false"
        />

      </div>


      <div
        id="message"
        class="message hidden"
      ></div>


      <!-- ========================================
           DETAILED STATUS CARD
      ========================================= -->

      <section
        id="statusCard"
        class="status-card hidden"
      >

        <div class="status-card-title">
          NOCTIS
        </div>


        <div class="detail-stat">

          <span>
            HAPPINESS
          </span>

          <span id="happinessValue">
            0
          </span>

        </div>

        <div class="detail-meter">
          <div id="detailHappiness"></div>
        </div>


        <div class="detail-stat">

          <span>
            HUNGER
          </span>

          <span id="hungerValue">
            0
          </span>

        </div>

        <div class="detail-meter">
          <div id="detailHunger"></div>
        </div>


        <div class="detail-stat">

          <span>
            ENERGY
          </span>

          <span id="energyValue">
            0
          </span>

        </div>

        <div class="detail-meter">
          <div id="detailEnergy"></div>
        </div>


        <div class="detail-stat">

          <span>
            HEALTH
          </span>

          <span id="healthValue">
            0
          </span>

        </div>

        <div class="detail-meter">
          <div id="detailHealth"></div>
        </div>


        <div class="detail-stat">

          <span>
            CLEAN
          </span>

          <span id="cleanValue">
            0
          </span>

        </div>

        <div class="detail-meter">
          <div id="detailClean"></div>
        </div>

      </section>

    </section>


    <!-- ============================================
         INTERACTION TRAY
    ============================================= -->

    <section
      id="actionTray"
      class="action-tray hidden-tray"
    >

      <button
        class="action focusable selected"
        data-action="feed"
        tabindex="0"
      >

        <span class="action-icon">
          ◆
        </span>

        <span class="action-label">
          FEED
        </span>

      </button>


      <button
        class="action focusable"
        data-action="play"
        tabindex="0"
      >

        <span class="action-icon">
          ▲
        </span>

        <span class="action-label">
          PLAY
        </span>

      </button>


      <button
        class="action focusable"
        data-action="pet"
        tabindex="0"
      >

        <span class="action-icon">
          ♥
        </span>

        <span class="action-label">
          PET
        </span>

      </button>


      <button
        class="action focusable"
        data-action="clean"
        tabindex="0"
      >

        <span class="action-icon">
          ✦
        </span>

        <span class="action-label">
          CLEAN
        </span>

      </button>


      <button
        class="action focusable"
        data-action="sit"
        tabindex="0"
      >

        <span class="action-icon">
          ▼
        </span>

        <span class="action-label">
          SIT
        </span>

      </button>


      <button
        class="action focusable"
        data-action="sleep"
        tabindex="0"
      >

        <span class="action-icon">
          ☾
        </span>

        <span class="action-label">
          SLEEP
        </span>

      </button>


      <button
        class="action focusable"
        data-action="medicine"
        tabindex="0"
      >

        <span class="action-icon">
          +
        </span>

        <span class="action-label">
          MED
        </span>

      </button>

    </section>


    <!-- ============================================
         CONTROL HINT
    ============================================= -->

    <div
      id="controlHint"
      class="control-hint"
    >
      SWIPE DOWN TO INTERACT
    </div>

  </main>


  <script src="app.js"></script>

</body>

</html>
