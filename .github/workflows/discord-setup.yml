name: Set up Pocket Furry Discord

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first, then apply
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply

permissions: {}

concurrency:
  group: pocket-furry-discord-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      SETUP_MODE: ${{ inputs.mode }}
    steps:
      - name: Configure Discord
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          GUILD = "1549107286020984992"
          APP = "1549108465824432148"
          TOKEN = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          APPLY = os.environ["SETUP_MODE"] == "apply"
          BASE = "https://discord.com/api/v10"

          if not TOKEN:
              raise SystemExit("Missing DISCORD_BOT_TOKEN secret.")

          def api(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              headers = {
                  "Authorization": "Bot " + TOKEN,
                  "Content-Type": "application/json",
                  "User-Agent": "PocketFurrySetup/1.0",
              }
              for attempt in range(6):
                  request = urllib.request.Request(
                      BASE + path, data=body, headers=headers, method=method
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          raw = response.read()
                      time.sleep(0.4)
                      return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as error:
                      raw = error.read()
                      if error.code == 429:
                          delay = float(json.loads(raw).get("retry_after", 2))
                          time.sleep(min(max(delay, 1), 60))
                          continue
                      # Never print credentials, request headers, or response bodies.
                      raise SystemExit(
                          f"Discord returned HTTP {error.code} for {method} {path}. "
                          "Stopped; completed additions remain. "
                          "Check bot installation and permissions before rerunning."
                      ) from None
                  except urllib.error.URLError:
                      raise SystemExit(
                          "Network request failed. Inspect Discord before rerunning."
                      ) from None
              raise SystemExit("Discord rate limit persisted. Try again later.")

          app = api("GET", "/oauth2/applications/@me")
          if app["id"] != APP:
              raise SystemExit("This token belongs to a different application.")

          me = api("GET", "/users/@me")
          guild = api("GET", f"/guilds/{GUILD}")
          roles = api("GET", f"/guilds/{GUILD}/roles")
          channels = api("GET", f"/guilds/{GUILD}/channels")
          member = api("GET", f"/guilds/{GUILD}/members/{me['id']}")
          role_ids = set(member["roles"]) | {GUILD}
          permissions = 0
          for role in roles:
              if role["id"] in role_ids:
                  permissions |= int(role["permissions"])

          VIEW = 1 << 10
          SEND = 1 << 11
          HISTORY = 1 << 16
          REQUIRED = VIEW | SEND | HISTORY | (1 << 4) | (1 << 28)
          if not permissions & (1 << 3):
              if permissions & REQUIRED != REQUIRED:
                  raise SystemExit(
                      "Bot needs Manage Channels, Manage Roles, View Channels, "
                      "Send Messages, and Read Message History."
                  )

          community = "COMMUNITY" in guild.get("features", [])
          print("Server:", guild["name"], GUILD)
          print("Mode:", "APPLY" if APPLY else "PREVIEW")
          print("Community enabled:", community)

          role_specs = [
              ("Moderator", 0x8A35FF),
              ("Triage", 0xB26AFF),
              ("Tester", 0x43B581),
              ("Meta Display Tester", 0x7289DA),
              ("Phone / Web Tester", 0xFAA61A),
          ]

          # Refuse ambiguous role names before making any changes.
          for name, color in role_specs:
              matches = [r for r in roles if r["name"] == name]
              if len(matches) > 1:
                  raise SystemExit("Duplicate role name: " + name)
              if matches and matches[0].get("managed"):
                  raise SystemExit("Reserved managed role name: " + name)

          selected = {}
          for name, color in role_specs:
              found = next((r for r in roles if r["name"] == name), None)
              if found:
                  print("Keep role:", name)
              else:
                  print("Create role:", name)
                  if APPLY:
                      found = api("POST", f"/guilds/{GUILD}/roles", {
                          "name": name,
                          "permissions": "0",
                          "color": color,
                          "mentionable": False,
                      })
                  else:
                      found = {"id": "preview-" + name}
              selected[name] = found["id"]

          def overwrites(kind):
              result = [{
                  "id": GUILD, "type": 0,
                  "allow": str(0 if kind == "staff" else VIEW),
                  "deny": str(VIEW if kind == "staff" else 0),
              }]
              if kind == "read":
                  # Prevent posting and creating/replying in threads.
                  result[0]["deny"] = str(
                      SEND | (1 << 35) | (1 << 36) | (1 << 38)
                  )
              if kind == "staff":
                  for name in ("Moderator", "Triage"):
                      result.append({
                          "id": selected[name], "type": 0,
                          "allow": str(VIEW | SEND | HISTORY), "deny": "0",
                      })
              result.append({
                  "id": me["id"], "type": 1,
                  "allow": str(VIEW | SEND | HISTORY), "deny": "0",
              })
              return result

          def ensure_channel(name, channel_type, parent, kind, topic="", tags=None):
              matches = [c for c in channels if c["name"] == name]
              if len(matches) > 1:
                  raise SystemExit("Ambiguous existing channel: " + name)
              if matches:
                  print("Keep existing channel unchanged:", name)
                  return matches[0], False
              print("Create channel:", name)
              if not APPLY:
                  return {"id": "preview-" + name, "type": channel_type}, True
              payload = {
                  "name": name,
                  "type": channel_type,
                  "permission_overwrites": overwrites(kind),
              }
              if parent:
                  payload["parent_id"] = parent
              if topic:
                  payload["topic"] = topic
              if tags:
                  payload["available_tags"] = [
                      {"name": tag, "moderated": False} for tag in tags
                  ]
              result = api("POST", f"/guilds/{GUILD}/channels", payload)
              channels.append(result)
              return result, True

          def post(channel, text):
              api("POST", f"/channels/{channel['id']}/messages", {
                  "content": text,
                  "allowed_mentions": {"parse": []},
              })

          specs = [
              ("START HERE", "read", [
                  ("rules", "Welcome and testing rules.",
                   "**Welcome to Pocket Furry!**\n"
                   "Help test Noctis, Cotton, controls, needs, and animations.\n\n"
                   "• Be respectful. Critique the app, not each other.\n"
                   "• Report one problem per post and check for duplicates.\n"
                   "• Keep content suitable for a general audience.\n"
                   "• Do not share personal information or credentials.\n"
                   "• Crop private information from screenshots.\n"
                   "• Avoid clearing site data: it can erase your companion."),
                  ("announcements", "Releases and important tester updates.",
                   "**Pocket Furry testing is open.**\n"
                   "Build notices go here. Ask questions in testing-chat."),
                  ("current-build", "Maintainer posts the live test URL and build.",
                   "**Current test build**\"
                   "\nLive URL: awaiting maintainer\n"
                   "Build/date: awaiting maintainer\n"
                   "Testing focus: controls, mood, saves, and animation transitions."),
                  ("known-issues", "Confirmed bugs and available workarounds.",
                   "**Known issues**\n"
                   "This list has not yet been populated or verified.\n"
                   "Maintainer: add confirmed problems and their tracking links."),
              ]),
              ("TESTING", "public", [
                  ("testing-chat", "Testing questions and reproduction help.",
                   "Ask quick questions here. Use bug-reports for individual bugs."),
              ]),
              ("COMMUNITY", "public", [
                  ("general", "Meet other Pocket Furry testers.",
                   "Welcome to the den! What device are you testing on?"),
                  ("screenshots-and-gifs", "Companions, animations, and funny moments.",
                   "Share your Pocket Furry screenshots and GIFs here."),
              ]),
              ("STAFF", "staff", [
                  ("triage", "Private report review and reproduction notes.",
                   "**Report workflow**\n"
                   "New → confirm/reproduce → fix → ready to retest → resolved.\n"
                   "Link an existing report when marking a duplicate.\n"
                   "Ask for device, browser, character, and reproducible steps."),
                  ("dev-log", "Private development notes.",
                   "Record changes, affected builds, and retest results here."),
                  ("mod-log", "Private staff notes and Community updates.",
                   "Staff notes only. Avoid recording unnecessary personal information."),
              ]),
          ]

          # Correct starter text is supplied separately for readability.
          specs[0][2][2] = (
              "current-build",
              "Maintainer posts the live test URL and build.",
              "**Current test build**\n"
              "Live URL: awaiting maintainer\n"
              "Build/date: awaiting maintainer\n"
              "Testing focus: controls, mood, saves, and animation transitions."
          )

          categories = {}
          for category_name, kind, items in specs:
              category, created = ensure_channel(category_name, 4, None, kind)
              if category["type"] != 4:
                  raise SystemExit("Category name conflicts with channel: " + category_name)
              categories[category_name] = category["id"]
              for name, topic, starter in items:
                  channel, created = ensure_channel(
                      name, 0, category["id"], kind, topic
                  )
                  if APPLY and created:
                      post(channel, starter)

          reports = [
              ("bug-reports",
               "One bug per post. Search first.\n\n"
               "Device/browser:\nBuild/date:\nCharacter:\nAnimation/action:\n"
               "What happened:\nExpected behavior:\nSteps to reproduce:\n"
               "Frequency:\nScreenshot/video:\n\nNever include credentials.",
               ["New", "Needs info", "Confirmed", "In progress",
                "Ready to retest", "Resolved", "Duplicate"]),
              ("feature-requests",
               "One idea per post.\n\n"
               "What would you like changed?\n"
               "What problem would it solve?\n"
               "Which character, control, animation, or screen is involved?",
               ["Idea", "Discussing", "Planned", "Added", "Not planned"]),
          ]

          if community:
              for name, guide, tags in reports:
                  ensure_channel(
                      name, 15, categories["TESTING"], "public", guide, tags
                  )
          else:
              print(
                  "FORUMS PENDING: Enable Community in Discord, selecting "
                  "rules and mod-log when asked. Then rerun this workflow "
                  "in apply mode to add bug-reports and feature-requests."
              )

          print(
              "Finished. Existing channels and their permissions were not changed. "
              "No roles were assigned to members. "
              "Moderator/Triage are staff-access roles, not administrator roles."
          )
